  LookBook web entry point and startup splash.
  Author: Ariel Fajimiyo
  Date: 22/10/26

<!DOCTYPE html>
<html lang="en">
<head>
  <!-- Flutter replaces this value when building for a deployment path. -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="LookBook — your wardrobe, less guesswork.">
  <meta name="theme-color" content="#fafaf8">

  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="LookBook">

  <link rel="apple-touch-icon" href="icons/Icon-192.png">
  <link rel="icon" type="image/png" href="favicon.png">
  <link rel="manifest" href="manifest.json">
  <link rel="stylesheet" href="styles.css">

  <title>LookBook</title>
</head>
<body>
  <div id="lookbook-loader" role="status" aria-label="Loading LookBook">
    <div class="lookbook-brand">
      <p class="lookbook-title">LOOKBOOK</p>
      <div class="lookbook-line"></div>
    </div>
  </div>

  <!-- Register the splash listener before starting Flutter. -->
  <script src="splash.js"></script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
